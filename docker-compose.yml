# Full stack locally: Postgres + API + frontend.
#   cp .env.example .env   (fill in the secrets)
#   docker compose up --build
# Or just the database, for `npm run dev` in both apps:  docker compose up db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_dev_password}
      POSTGRES_DB: vault
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://vault:${POSTGRES_PASSWORD:-vault_dev_password}@db:5432/vault
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      ALLOWED_ORIGINS: http://localhost:3000
      # Seeds the admin account on start when set (see backend/scripts/seed-admin.mjs)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    # Not published: only the frontend talks to the API, as on Railway.

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:4000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
